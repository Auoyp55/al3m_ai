<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b20">
<title>AL3M AI — Beyond The Sky</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sky" id="sky">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="sun"></div>
  <div class="cloud cloud-one"></div>
  <div class="cloud cloud-two"></div>
  <div class="cloud cloud-three"></div>
  <div class="horizon"></div>
</div>

<div class="scene">
  <header class="brand">
    <div class="brand-symbol">✦</div>
    <h1>AL3M <span>AI</span></h1>
    <p class="brand-subtitle">YOUR INTELLIGENCE. YOUR UNIVERSE.</p>
    <div class="brand-line"></div>
  </header>

  <main class="glass-card">
    <div class="welcome">
      <div class="welcome-icon">✧</div>
      <h2>مرحباً بعودتك</h2>
      <p>رحلتك إلى عالم الذكاء تبدأ هنا</p>
    </div>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <div class="input-box">
        <span class="input-icon">✉</span>
        <input id="email" type="email" placeholder="name@example.com"
          autocomplete="email" required>
      </div>

      <label for="password">كلمة المرور</label>
      <div class="input-box">
        <span class="input-icon">♙</span>
        <input id="password" type="password" placeholder="أدخل كلمة المرور"
          autocomplete="current-password" required>
        <button class="show-password" id="showPassword" type="button"
          aria-label="إظهار كلمة المرور">◉</button>
      </div>

      <div class="form-options">
        <label class="remember">
          <input id="remember" type="checkbox">
          <span>تذكرني</span>
        </label>
        <button type="button" class="text-button" id="forgotPassword">
          نسيت كلمة المرور؟
        </button>
      </div>

      <button class="login-button" type="submit">
        <span>تسجيل الدخول</span>
        <span class="button-arrow">←</span>
      </button>

      <div class="divider"><span>أو</span></div>

      <button class="create-button" id="createAccount" type="button">
        إنشاء حساب جديد <span>✧</span>
      </button>

      <p class="message" id="message" role="status"></p>
    </form>
  </main>

  <footer>
    <span class="footer-star">✦</span>
    <span>WHERE THE SKY MEETS INTELLIGENCE</span>
    <span class="footer-star">✦</span>
  </footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
